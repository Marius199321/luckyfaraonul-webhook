<!DOCTYPE html>
<html>
<head><title>Test Stripe</title></head>
<body>
  <button id="checkoutBtn">Plătește test</button>
  <script>
    document.getElementById('checkoutBtn').addEventListener('click', async () => {
      const response = await fetch('https://luckyfaraonul-webhook.vercel.app/api/createCheckoutSession', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          qty: 2,
          productId: 'prod_SFZ0yLT3aa1P0U',
          productName: 'Win £1000',
          stripePriceId: 'price_1RL3s6QsmTbok5qV2lSuAe54'
        })
      });

      const data = await response.json();
      if (data.id) {
        window.location.href = `https://checkout.stripe.com/pay/${data.id}`;
      } else {
        alert('Eroare la creare sesiune!');
        console.error(data);
      }
    });
  </script>
</body>
</html>
