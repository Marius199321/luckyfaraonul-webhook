<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Stripe</title>
</head>
<body>
  <button id="payBtn">Plătește test</button>

  <script>
    document.getElementById('payBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('https://luckyfaraonul-webhook.vercel.app/api/createCheckoutSession', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            qty: 1,
            productId: 'prod_SI9EFhKDzg6MVj',
            productName: 'Test Product'
          })
        });

        const data = await response.json();

        if (data.id) {
          window.location.href = `https://checkout.stripe.com/pay/${data.id}`;
        } else {
          alert('Eroare: ' + JSON.stringify(data));
        }
      } catch (error) {
        alert('Eroare la cerere: ' + error.message);
        console.error(error);
      }
    });
  </script>
</body>
</html>
